[project]
name = "grooveloop"
version = "0.1.0"
description = "CLI orchestrator that drives the software delivery cycle by delegating each step to coding agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Pascual Montesinos" }]
requires-python = ">=3.13"
keywords = ["agents", "claude-code", "github", "orchestrator", "sdlc", "slicing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "injector>=0.21",
    "pygithub>=2.9.1",
    "rich>=14",
    "textual>=8",
]

[project.urls]
Repository = "https://github.com/pasmontesinos/grooveloop"

[project.scripts]
grooveloop = "grooveloop.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grooveloop"]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.13",
    "ruff>=0.8",
    "hypothesis>=6.155.7",
]

[tool.ruff]
line-length = 120
extend-exclude = [
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "B",
    "C4",
    "C90",
    "UP",
    "RUF",
    "PERF",
    "TC",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["injector.provider", "injector.multiprovider"]

[tool.ruff.lint.isort]
known-first-party = ["grooveloop"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration",
    "entrypoint: marks tests that run from real entrypoints",
]
addopts = ["--strict-markers"]
pythonpath = "src"
testpaths = ["tests"]
filterwarnings = [
    "error",
]
cache_dir = "/tmp/.pytest_cache"

[tool.mypy]
mypy_path = ["src"]
files = ["src", "tests"]

warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_unreachable = true
warn_no_return = true
warn_return_any = true

disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
strict = true
extra_checks = true

check_untyped_defs = true
no_implicit_optional = true

ignore_missing_imports = false
follow_imports = "normal"

namespace_packages = true
explicit_package_bases = true

pretty = true
show_error_codes = true
show_column_numbers = true
